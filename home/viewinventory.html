<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Lyxen | BRAHMVANDA</title>
    <link rel="icon" type="image/png" href="favicon1.png">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.4);
        }

        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 99999;
        }

        .splash-logo {
            width: auto;
            max-width: 110px;
            max-height: 110px;
            object-fit: contain;
            margin-bottom: 18px;
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            filter: drop-shadow(0 10px 25px rgba(255, 255, 255, 0.2));
        }

        .splash-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 14px;
            text-transform: uppercase;
            position: relative;
            left: 7px;
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* TOP CORNER PROFESSIONAL BUTTONS */
        .top-left-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 18px;
            background: transparent;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .top-left-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .top-right-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 18px;
            background: transparent;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .top-right-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 30px 25px;
            background: rgba(19, 25, 33, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .card-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin: 0 auto 10px auto;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(255, 255, 255, 0.2));
        }

        .company-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            font-weight: 600;
            color: #a0aec0;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #a0aec0;
            margin-bottom: 6px;
            display: block;
        }

        .login-input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #232f3e;
            border-radius: 6px;
            background: #1a222d;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .login-input:focus {
            border-color: #434c5e;
        }

        .login-btn {
            width: 100%;
            height: 42px;
            margin-top: 10px;
            background: #ffffff;
            color: #131921;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- TOP CORNER BUTTONS -->
    <button type="button" class="top-left-btn" id="backBtn">Back</button>
    <button type="button" class="top-right-btn" id="contactBtn">Contact</button>

    <div id="splashScreen">
        <img src="./logo.png" alt="Logo" class="splash-logo">
        <div class="splash-title">Lyxen</div>
    </div>

    <video autoplay muted loop id="bgVideo">
        <source src="viewinventory.mp4" type="video/mp4">
    </video>

    <div class="login-card">
        <img src="./logo.png" alt="Logo" class="card-logo">
        <div class="company-name">Lyxen</div>
        <div class="login-subtitle">Inventory Login</div>
        
        <form id="loginForm">
            <div class="input-group">
                <label class="input-label">Email ID</label>
                <input type="email" class="login-input" id="loginEmail" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="login-input" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            setTimeout(function() {
                $('#splashScreen').fadeOut(400, function() {
                    $(this).remove();
                });
            }, 2000);

            $('#contactBtn').on('click', function() {
                window.location.href = 'contact.html';
            });

            $('#backBtn').on('click', function() {
                window.location.href = 'inventory.html';
            });

            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                const email = $('#loginEmail').val();
                const password = $('#loginPassword').val();
                
                alert('Login functionality goes here!');
            });
        });
    </script>
</body>
</html>
